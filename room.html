<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Silk Road Training WebXR — Hostile Environment Demonstration">
    <meta name="theme-color" content="#070806">
    <title>Hostile Environment Training - WebXR</title>
    <link rel="icon" href="assets/images/SR_logo.png" type="image/png">

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>

    <script>
        AFRAME.registerComponent('play-bounds', {
            schema: {
                minX: { default: -18 }, maxX: { default: 34 },
                minZ: { default: -18 }, maxZ: { default: 14 },
                speed: { default: 3.2 }
            },
            init: function () {
                this.stick = { x: 0, z: 0 };
                window.__playStick = this.stick;
            },
            tick: function (_t, dt) {
                const p = this.el.object3D.position;
                const sec = Math.min((dt || 16) / 1000, 0.08);
                const cam = document.getElementById('main-camera');
                if (cam && cam.object3D && (this.stick.x || this.stick.z)) {
                    const yaw = cam.object3D.rotation.y;
                    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
                    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
                    p.x += (this.stick.z * fx + this.stick.x * rx) * this.data.speed * sec;
                    p.z += (this.stick.z * fz + this.stick.x * rz) * this.data.speed * sec;
                }
                p.x = Math.max(this.data.minX, Math.min(this.data.maxX, p.x));
                p.z = Math.max(this.data.minZ, Math.min(this.data.maxZ, p.z));
            }
        });

        // Stop the rig walking through the ruined building once that model is loaded.
        // Horizontal raycasts against its meshes; floors and ceilings are ignored.
        AFRAME.registerComponent('mesh-walls', {
            schema: {
                target: { type: 'string', default: '#ruined-building' },
                extra: { type: 'string', default: '' },
                radius: { default: 0.42 },
                heights: { type: 'string', default: '0.35 1.05 1.55' }
            },
            init: function () {
                this.raycaster = new THREE.Raycaster();
                this.prev = this.el.object3D.position.clone();
                this.origin = new THREE.Vector3();
                this.dir = new THREE.Vector3();
                this.worldNormal = new THREE.Vector3();
                this.heights = this.data.heights.split(/\s+/).map(parseFloat);
                this.ready = false;
                this.meshes = [];
                this.el.sceneEl.addEventListener('loaded', () => this.collectMeshes());
                const building = document.querySelector(this.data.target);
                if (building) {
                    building.addEventListener('model-loaded', () => this.collectMeshes());
                }
                setTimeout(() => this.collectMeshes(), 800);
            },
            collectMeshes: function () {
                this.meshes = [];
                const add = (root) => {
                    if (!root || !root.object3D) return;
                    root.object3D.updateMatrixWorld(true);
                    root.object3D.traverse((obj) => {
                        if (obj.isMesh && obj.geometry) this.meshes.push(obj);
                    });
                };
                add(document.querySelector(this.data.target));
                if (this.data.extra) document.querySelectorAll(this.data.extra).forEach(add);
                this.ready = this.meshes.length > 0;
            },
            isWallHit: function (hit) {
                if (!hit || !hit.face) return false;
                this.worldNormal.copy(hit.face.normal);
                if (hit.object && hit.object.matrixWorld) {
                    this.worldNormal.transformDirection(hit.object.matrixWorld);
                }
                this.worldNormal.normalize();
                return Math.abs(this.worldNormal.y) < 0.72;
            },
            blocked: function (from, direction, distance) {
                if (!this.ready) this.collectMeshes();
                if (!this.meshes.length) return false;
                const far = distance + this.data.radius;
                this.raycaster.far = far;
                for (let i = 0; i < this.heights.length; i++) {
                    this.origin.copy(from);
                    this.origin.y += this.heights[i];
                    this.raycaster.set(this.origin, direction);
                    const hits = this.raycaster.intersectObjects(this.meshes, false);
                    for (let h = 0; h < hits.length; h++) {
                        if (this.isWallHit(hits[h]) && hits[h].distance < far) return true;
                    }
                }
                return false;
            },
            tick: function () {
                const p = this.el.object3D.position;
                this.dir.set(p.x - this.prev.x, 0, p.z - this.prev.z);
                const dist = this.dir.length();
                if (dist < 0.0001) {
                    this.prev.set(p.x, p.y, p.z);
                    return;
                }
                this.dir.multiplyScalar(1 / dist);
                if (this.blocked(this.prev, this.dir, dist)) {
                    p.x = this.prev.x;
                    p.z = this.prev.z;
                } else {
                    this.prev.set(p.x, p.y, p.z);
                }
            }
        });

        // Off-screen kit stays clickable through a hit box. The GLB is fetched when
        // the visitor is near it, looks toward it, or the staggered queue reaches it.
        AFRAME.registerComponent('lazy-gltf', {
            schema: {
                src: { type: 'string', default: '' },
                width: { default: 1 },
                height: { default: 1 },
                depth: { default: 1 },
                offset: { type: 'vec3', default: { x: 0, y: 0, z: 0 } },
                distance: { default: 20 }
            },
            init: function () {
                this.loaded = false;
                this._cool = 0;
                this._camPos = new THREE.Vector3();
                this._objPos = new THREE.Vector3();
                this._quat = new THREE.Quaternion();
                this._forward = new THREE.Vector3();
                const box = document.createElement('a-box');
                box.setAttribute('class', 'clickable');
                box.setAttribute('width', this.data.width);
                box.setAttribute('height', this.data.height);
                box.setAttribute('depth', this.data.depth);
                const o = this.data.offset;
                box.setAttribute('position', o.x + ' ' + o.y + ' ' + o.z);
                box.setAttribute('material', 'opacity: 0; transparent: true; depthWrite: false; shader: flat');
                box.setAttribute('shadow', 'cast: false; receive: false');
                this.el.appendChild(box);
                this.modelEl = document.createElement('a-gltf-model');
                this.modelEl.setAttribute('class', 'clickable');
                this.el.appendChild(this.modelEl);
            },
            loadNow: function () {
                if (this.loaded || !this.data.src) return;
                this.loaded = true;
                this.modelEl.setAttribute('src', this.data.src);
            },
            tick: function (_t, dt) {
                if (this.loaded) return;
                this._cool += dt || 16;
                if (this._cool < 350) return;
                this._cool = 0;
                const cam = document.getElementById('main-camera');
                if (!cam || !cam.object3D) return;
                cam.object3D.getWorldPosition(this._camPos);
                this.el.object3D.getWorldPosition(this._objPos);
                const dx = this._objPos.x - this._camPos.x;
                const dz = this._objPos.z - this._camPos.z;
                const dist2 = dx * dx + dz * dz;
                const reach = this.data.distance;
                if (dist2 < reach * reach) {
                    this.loadNow();
                    return;
                }
                cam.object3D.getWorldQuaternion(this._quat);
                this._forward.set(0, 0, -1).applyQuaternion(this._quat);
                const len = Math.sqrt(dist2) || 1;
                const dot = (this._forward.x * dx + this._forward.z * dz) / len;
                if (dot > 0.6 && dist2 < 48 * 48) this.loadNow();
            }
        });
    </script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
        #status {
            position: absolute; top: 10px; left: 10px; color: #c6b13a;
            background: rgba(0,0,0,0.75); padding: 10px 12px; z-index: 100;
            font-family: ui-monospace, monospace; font-size: 13px; border-radius: 6px;
            pointer-events: none;
        }
        #instructions {
            position: absolute; bottom: 10px; left: 12px; color: #e8e4d4;
            background: rgba(0,0,0,0.72); padding: 7px 10px; border-radius: 6px;
            max-width: min(58vw, 280px); font-size: 11px; line-height: 1.35; z-index: 100;
        }
        #instructions strong { font-size: 11px; letter-spacing: 0.04em; }
        #instructions a { color: #c6b13a; }
        body.in-vr #status,
        body.in-vr #instructions,
        body.in-vr #stick-wrap,
        body.in-vr #toast { display: none !important; }

        #screen-overlay, #video-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95);
            display: none; z-index: 200; align-items: center; justify-content: center; flex-direction: column;
        }
        #screen-frame {
            width: 88%; height: 82%; background: #111;
            border: 10px solid #c6b13a; border-radius: 16px; overflow: hidden;
        }
        #screen-frame iframe { width: 100%; height: 100%; border: none; }
        #video-overlay video {
            max-width: 90%; max-height: 78%;
            border: 6px solid #c6b13a; border-radius: 12px;
        }
        #close-screen, #close-video, #close-vr-browser {
            position: absolute; top: 25px; right: 25px;
            background: #ff2222; color: white; padding: 14px 28px;
            border: none; border-radius: 8px; font-size: 20px; cursor: pointer; z-index: 210;
        }
        #vr-browser-overlay {
            position: absolute; inset: 0; background: #000;
            display: none; z-index: 220; flex-direction: column;
        }
        #vr-browser-overlay iframe {
            flex: 1; width: 100%; border: 0; background: #000;
        }
        #toast {
            position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
            background: rgba(10, 16, 12, 0.92); color: #e8e4d4;
            border: 1px solid #c6b13a; border-radius: 10px;
            padding: 12px 18px; max-width: min(90vw, 420px); text-align: center;
            z-index: 150; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease; font-size: 15px;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #stick-wrap {
            display: none; position: absolute; left: 18px; bottom: 18px; width: 112px; height: 112px; z-index: 25;
            border-radius: 999px; background: rgba(16,24,20,0.55); border: 1px solid rgba(198,177,58,0.35);
            touch-action: none;
        }
        #stick {
            position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
            border-radius: 999px; background: #c6b13a; opacity: 0.85; pointer-events: none;
        }
        @media (pointer: coarse) {
            #stick-wrap { display: block; }
            #instructions { left: 128px; max-width: calc(100vw - 148px); }
        }
    </style>
</head>
<body>
    <div id="status">Silk Road Training — loading…</div>
    <div id="instructions">
        <strong>CONTROLS</strong><br>
        Desktop: WASD or arrows, click to look.<br>
        Phone: drag to look, use the stick.<br>
        VR: Quest VR button, sticks to walk, trigger to select.<br>
        <a href="index.html">Leave room</a>
    </div>
    <div id="stick-wrap"><div id="stick"></div></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <div id="screen-overlay">
        <button id="close-screen" type="button">✕ CLOSE SCREEN</button>
        <div id="screen-frame">
            <iframe id="content-iframe" title="Training content" allowfullscreen></iframe>
        </div>
    </div>
    <div id="video-overlay">
        <button id="close-video" type="button">✕ CLOSE VIDEO</button>
        <video id="overlay-video" controls playsinline></video>
    </div>
    <video id="kit-video" playsinline webkit-playsinline crossorigin="anonymous" preload="auto" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
    <video id="sphere-video" playsinline webkit-playsinline crossorigin="anonymous" preload="auto" loop style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
    <div id="vr-browser-overlay">
        <button id="close-vr-browser" type="button">✕ EXIT BROWSER</button>
        <iframe id="vr-browser-iframe" title="Immersive training content" allowfullscreen allow="autoplay; xr-spatial-tracking"></iframe>
    </div>

    <a-scene
        xr="vr: true"
        webxr="optionalFeatures: local-floor, bounded-floor, dom-overlay; overlayElement: #vr-browser-overlay"
        xr-mode-ui="XRMode: vr"
        background="color: #1a140e"
        cursor="rayOrigin: mouse; fuse: false"
        raycaster="objects: .clickable; far: 50"
        shadow="type: pcf"
        draco-decoder-path="https://www.gstatic.com/draco/versioned/decoders/1.5.6/"
        renderer="colorManagement: true; antialias: true; highRefreshRate: true"
        loading-screen="dotsColor: #c6b13a; backgroundColor: #070806; enabled: true">

        <a-assets timeout="8000">
            <img id="asset-logo" src="assets/images/SR_logo.png" crossorigin="anonymous">
            <img id="asset-assailant" src="assets/images/active_assailant.jpg" crossorigin="anonymous">
            <img id="asset-bridge" src="assets/images/bridge_scenario.png" crossorigin="anonymous">
        </a-assets>

        <!-- Sky and building stay out of a-assets. Desktop and Quest load them in JS. -->
        <a-entity id="environment-group" visible="false">
            <a-sky id="sky-dome" radius="80"></a-sky>

            <a-gltf-model id="ruined-building" position="-2.962 0 0" rotation="0 24 0" scale="1 1 1"></a-gltf-model>

            <a-image id="sr-logo" src="#asset-logo" position="-2.96 5.665 -5.611" rotation="0 0 0"
                     width="5.2" height="3.4" material="shader: flat; side: double"></a-image>
            <a-text value="WebXR" position="-2.872 4.091 -5.539" rotation="0 0 0" align="center" width="8" color="#c6b13a"
                    font="https://cdn.aframe.io/fonts/Roboto-msdf.json"></a-text>
        </a-entity>

        <a-entity id="room-group">
            <!-- Smart screen — Active Assailant HTML -->
            <a-entity id="smart-screen" class="clickable" position="-12.906 5 2.804" rotation="0 90 0">
                <a-box width="4.4" height="2.7" depth="0.12" color="#161616"></a-box>
                <a-plane width="4.1" height="2.4" position="0 0 0.07"
                         material="src: #asset-assailant; shader: flat; side: double" class="clickable"></a-plane>
            </a-entity>
            <a-text value="CLICK FOR ACTIVE ASSAILANT CONTENT"
                    position="-12.906 3 2.804" rotation="0 90 0" align="center" width="4.6" color="#c6b13a"></a-text>

            <!-- Bridge scenario frame -->
            <a-entity id="bridge-frame" class="clickable" position="13.624 5 3.997" rotation="0 270 0">
                <a-box width="4.4" height="2.7" depth="0.12" color="#2c1e16"></a-box>
                <a-plane width="4.1" height="2.4" position="0 0 0.07"
                         material="src: #asset-bridge; shader: flat; side: double" class="clickable"></a-plane>
            </a-entity>
            <a-text value="CLICK FOR 360 INTERACTIVE SCENARIO"
                    position="13.624 3 3.997" rotation="0 270 0" align="center" width="4.6" color="#c6b13a"></a-text>

            <!-- Shiny silver 360 orb -->
            <a-sphere id="video-ball" class="clickable" position="-11.798 5.5 -2.947" radius="1"
                      material="color: #f3f8fc; metalness: 0.55; roughness: 0.03; emissive: #9eb0bc; emissiveIntensity: 0.08; transparent: true; opacity: 0.42"
                      animation="property: scale; to: 1.5 1.5 1.5; dur: 900; dir: alternate; loop: true; easing: easeInOutSine"></a-sphere>
            <a-text value="CLICK FOR 360 VIDEO DEMO" position="-11.662 3.463 -3.054" rotation="0 90 0" align="center" width="4.2" color="#c6b13a"></a-text>

            <!-- Kit models -->
            <a-entity id="claymore" class="clickable" position="1.957 0.539 -4.78" rotation="0 45 0" scale="0.5 0.5 0.5"
                      lazy-gltf="src: assets/models/claymore_mine.glb; width: 3.2; height: 2; depth: 3.2; offset: 0 0.2 0; distance: 22"></a-entity>
            <a-entity id="celox" class="clickable" position="11.846 0.278 7.31" scale="0.4 0.4 0.4" rotation="90 0 0"
                      lazy-gltf="src: assets/models/celox_rapid_haemostat.glb; width: 1.9; height: 1.5; depth: 2; offset: 0 0 0; distance: 18"></a-entity>
            <a-entity id="fpv-drone" class="clickable" position="-9.087 8.174 -15.505" scale="5 5 5"
                      lazy-gltf="src: assets/models/fpv_drone.glb; width: 0.48; height: 0.56; depth: 0.3; offset: 0 0.02 -0.008; distance: 22"></a-entity>
            <a-entity id="ballistic-plate" class="clickable" position="-2.376 1.266 -4.198" rotation="90 0 180" scale="0.3 0.3 0.3">
                <a-gltf-model class="clickable" src="assets/models/level_iv_ballistic_plate.glb"></a-gltf-model>
            </a-entity>
            <a-entity id="ak47" class="clickable" position="-6.652 0.8 -4.154" rotation="0 90 270" scale="0.05 0.05 0.05">
                <a-gltf-model class="clickable" src="assets/models/ak47.glb"></a-gltf-model>
            </a-entity>
            <a-entity id="garmin" class="clickable" position="-1.5 0.759 1.158" rotation="270 0 0" scale="0.3 0.3 0.3">
                <a-gltf-model class="clickable" src="assets/models/garmin_inreach_mini.glb"></a-gltf-model>
            </a-entity>
            <a-entity id="cover" class="clickable" position="12.972 0.345 -0.869" rotation="0 90 0" scale="2 2 2"
                      lazy-gltf="src: assets/models/sandbag_barrier.glb; width: 1.91; height: 0.5; depth: 0.35; offset: 0 0.001 -0.005; distance: 20"></a-entity>
            <a-entity id="correspondent" class="clickable" position="8.961 4.445 -4.045" rotation="0 270 0" scale="2.5 2.5 2.5"
                      lazy-gltf="src: assets/models/camera_with_tripod.glb; width: 0.8; height: 1.6; depth: 0.7; offset: -0.019 -0.124 -0.012; distance: 22"></a-entity>

            <!-- Casualty + blood + invisible hotspots -->
            <a-gltf-model src="assets/models/blood_spattered.glb"
                          position="3.393 0.339 7.375" rotation="0 90 0" scale="0.2 0.2 0.2"></a-gltf-model>
            <a-gltf-model id="casualty-model" src="assets/models/female_casualty.glb"
                          position="8.282 0.725 4.814" rotation="0 90 0" scale="5 5 5"
                          shadow="cast: true; receive: true"></a-gltf-model>
            <a-entity id="hotspot-head" class="clickable hotspot"
                      position="9.328 1.026 4.931"
                      geometry="primitive: plane; width: 0.55; height: 0.35"
                      material="opacity: 0; transparent: true; side: double"
                      rotation="-90 0 0"></a-entity>
            <a-entity id="hotspot-leg" class="clickable hotspot"
                      position="4.822 0.737 5.031"
                      geometry="primitive: plane; width: 0.55; height: 0.4"
                      material="opacity: 0; transparent: true; side: double"
                      rotation="-90 0 0"></a-entity>
            <a-text value="CLICK THE AREA FOR FIRST AID TREATMENT"
                      position="6.15 2.688 9.998" rotation="0 180 0" align="center" width="4.4" color="#e8e4d4"></a-text>
        </a-entity>

        <!-- 360 dome -->
        <a-entity id="video-mode" visible="false">
            <a-videosphere id="video360" src="#sphere-video" radius="22" loop="true"
                           material="shader: flat; side: back; transparent: false"></a-videosphere>
            <a-plane id="exit-button" position="0 2.2 -6" rotation="0 0 0" width="5" height="1.6"
                     material="color: #ff2222; emissive: #ff0000; shader: flat" class="clickable">
                <a-text value="EXIT 360 VIDEO" position="0 0 0.1" align="center" width="5" color="#ffffff"></a-text>
            </a-plane>
        </a-entity>

        <!-- VR-only 3DVista tour shell -->
        <a-entity id="bridge-mode" visible="false">
            <a-sphere id="bridge-sphere" radius="24"
                      material="color: #050505; side: back; shader: flat"></a-sphere>
            <a-plane id="exit-bridge" position="0 2.2 -6" width="5" height="1.6"
                     material="color: #ff2222; emissive: #ff0000; shader: flat" class="clickable">
                <a-text value="EXIT 360 TOUR" position="0 0 0.1" align="center" width="5" color="#ffffff"></a-text>
            </a-plane>
        </a-entity>

        <!-- Model viewer -->
        <a-entity id="model-viewer" visible="false" scale="0.5 0.5 0.5">
            <a-box width="6.2" height="5.4" depth="0.35" color="#0d1f2d" opacity="0.3"></a-box>
            <a-text id="viewer-title" value="MODEL INSPECTOR" position="0 2.35 0.25" align="center" width="5.5" color="#c6b13a"></a-text>
            <a-entity id="viewer-model" position="0 0.15 0.25"></a-entity>
            <a-plane width="5.8" height="1.9" position="0 -1.85 0.22" color="#0a1620" opacity="0.92">
                <a-text id="viewer-info" value="" position="0 0 0.12" align="center" width="5.3" color="#e8e4d4" wrap-count="48"></a-text>
            </a-plane>
            <a-plane id="viewer-drag-plane" width="5.5" height="3.2" position="0 0.4 0.3"
                     material="opacity: 0; transparent: true" class="clickable"></a-plane>
            <a-entity id="viewer-close" position="2.7 2.4 1.1" class="clickable">
                <a-box class="clickable" width="1.2" height="0.6" depth="0.15" color="#cc2222"></a-box>
                <a-text value="CLOSE" position="0 0 0.1" align="center" width="2" color="#ffffff" scale="0.7 0.7 0.7"></a-text>
            </a-entity>
            <a-entity id="viewer-reset" position="1.3 2.4 1.1" class="clickable">
                <a-box class="clickable" width="1.5" height="0.6" depth="0.15" color="#3366aa"></a-box>
                <a-text value="RESET" position="0 0 0.1" align="center" width="2.5" color="#ffffff" scale="0.65 0.65 0.65"></a-text>
            </a-entity>
            <a-entity id="rotate-left" position="-2.3 0.15 1.15" class="clickable">
                <a-box class="clickable" width="0.9" height="0.9" depth="0.15" color="#c6b13a"></a-box>
                <a-text value="<" position="0 0 0.12" align="center" width="3" color="#111" scale="1.2 1.2 1.2"></a-text>
            </a-entity>
            <a-entity id="rotate-right" position="2.3 0.15 1.15" class="clickable">
                <a-box class="clickable" width="0.9" height="0.9" depth="0.15" color="#c6b13a"></a-box>
                <a-text value=">" position="0 0 0.12" align="center" width="3" color="#111" scale="1.2 1.2 1.2"></a-text>
            </a-entity>
        </a-entity>

        <!-- Image viewer -->
        <a-entity id="image-viewer" visible="false" scale="0.5 0.5 0.5">
            <a-box width="6.2" height="5.4" depth="0.35" color="#0d1f2d" opacity="0.3"></a-box>
            <a-text id="image-viewer-title" value="INFORMATION" position="0 2.35 0.25" align="center" width="5.5" color="#c6b13a"></a-text>

                const len = Math.hypot(dx, dy) || 1;
                if (len > max) { dx = dx / len * max; dy = dy / len * max; }
                knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
                if (window.__playStick) {
                    window.__playStick.x = dx / max;
                    window.__playStick.z = -dy / max;
                }
            }
            wrap.addEventListener('pointerdown', function (e) {
                active = true;
                wrap.setPointerCapture(e.pointerId);
                setFromEvent(e);
            });
            wrap.addEventListener('pointermove', function (e) { if (active) setFromEvent(e); });
            function end(e) {
                active = false;
                knob.style.transform = '';
                if (window.__playStick) { window.__playStick.x = 0; window.__playStick.z = 0; }
                try { wrap.releasePointerCapture(e.pointerId); } catch (_) {}
            }
            wrap.addEventListener('pointerup', end);
            wrap.addEventListener('pointercancel', end);
        }

        sceneEl.addEventListener('loaded', function () {
            if (statusEl) statusEl.textContent = 'Silk Road Training — WebXR Demonstration';
            bindStick();

            loadEnvironment();

            const lazyEls = Array.prototype.slice.call(document.querySelectorAll('[lazy-gltf]'));
            lazyEls.sort(function (a, b) {
                const pa = a.object3D.position;
                const pb = b.object3D.position;
                const ra = rig ? rig.object3D.position : { x: 0, z: 0 };
                const da = (pa.x - ra.x) * (pa.x - ra.x) + (pa.z - ra.z) * (pa.z - ra.z);
                const db = (pb.x - ra.x) * (pb.x - ra.x) + (pb.z - ra.z) * (pb.z - ra.z);
                return da - db;
            });
            let lazyIndex = 0;
            function pumpLazy() {
                if (lazyIndex >= lazyEls.length) return;
                const el = lazyEls[lazyIndex++];
                const comp = el.components && el.components['lazy-gltf'];
                if (comp) comp.loadNow();
                setTimeout(pumpLazy, 600);
            }
            setTimeout(pumpLazy, 1600);

            const ambientSound = document.getElementById('ambient-sound');
            if (ambientSound && ambientSound.components && ambientSound.components.sound) {
                try { ambientSound.components.sound.playSound(); } catch (_) {}
            }

            sceneEl.addEventListener('enter-vr', function () {
                document.body.classList.add('in-vr');
                loadEnvironment();
            });
            sceneEl.addEventListener('exit-vr', function () { document.body.classList.remove('in-vr'); });

            Object.keys(modelData).forEach(function (id) {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('click', function (e) {
                    e.stopImmediatePropagation();
                    openModelViewer(modelData[id]);
                });
            });
            Object.keys(imageData).forEach(function (id) {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('click', function (e) {
                    e.stopImmediatePropagation();
                    openImageViewer(imageData[id]);
                });
            });
            Object.keys(videoData).forEach(function (id) {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('click', function (e) {
                    e.stopImmediatePropagation();
                    openVideoViewer(videoData[id]);
                });
            });

            const closeViewerBtn = document.getElementById('viewer-close');
            const resetBtn = document.getElementById('viewer-reset');
            if (closeViewerBtn) closeViewerBtn.addEventListener('click', function (e) { e.stopImmediatePropagation(); playClick(clickSound); closeAllViewers(); });
            if (resetBtn) resetBtn.addEventListener('click', function (e) {
                e.stopImmediatePropagation(); playClick(clickSound);
                rotX = initialRotX; rotY = initialRotY;
                const modelEl = viewerModelContainer && viewerModelContainer.querySelector('a-gltf-model');
                if (modelEl) {
                    if (modelEl.object3D) modelEl.object3D.rotation.set(rotX, rotY, 0);
                    modelEl.setAttribute('scale', initialScale);
                }
            });
            const rotateLeft = document.getElementById('rotate-left');
            const rotateRight = document.getElementById('rotate-right');
            if (rotateLeft) rotateLeft.addEventListener('click', function (e) { e.stopImmediatePropagation(); rotY -= 0.4; applyModelRotation(); playClick(clickSound); });
            if (rotateRight) rotateRight.addEventListener('click', function (e) { e.stopImmediatePropagation(); rotY += 0.4; applyModelRotation(); playClick(clickSound); });
            if (dragPlane) {
                dragPlane.addEventListener('pointerdown', function (e) {
                    if (!isEntityVisible(viewer)) return;
                    isDraggingViewer = true; prevMouseX = e.clientX; prevMouseY = e.clientY;
                    try { dragPlane.setPointerCapture(e.pointerId); } catch (_) {}
                });
            }
            document.addEventListener('pointermove', function (e) {
                if (!isDraggingViewer) return;
                rotY += (e.clientX - prevMouseX) * 0.005;
                rotX += (e.clientY - prevMouseY) * 0.005;
                rotX = Math.max(-1.4, Math.min(1.4, rotX));
                applyModelRotation();
                prevMouseX = e.clientX; prevMouseY = e.clientY;
            });
            document.addEventListener('pointerup', function (e) {
                if (isDraggingViewer && dragPlane) { try { dragPlane.releasePointerCapture(e.pointerId); } catch (_) {} }
                isDraggingViewer = false;
            });
            document.addEventListener('wheel', function (e) {
                if (!isEntityVisible(viewer) || !viewerModelContainer) return;
                const modelEl = viewerModelContainer.querySelector('a-gltf-model');
                if (!modelEl) return;
                let currentScale = modelEl.getAttribute('scale');
                if (typeof currentScale === 'string') {
                    const parts = currentScale.split(/\s+/).map(parseFloat);
                    currentScale = { x: parts[0] || 1, y: parts[1] || 1, z: parts[2] || 1 };
                } else if (!currentScale) currentScale = { x: 1, y: 1, z: 1 };
                const factor = e.deltaY > 0 ? 0.88 : 1.14;
                modelEl.setAttribute('scale', Math.max(0.2, Math.min(12, currentScale.x * factor)) + ' ' + Math.max(0.2, Math.min(12, currentScale.y * factor)) + ' ' + Math.max(0.2, Math.min(12, currentScale.z * factor)));
                e.preventDefault();
            }, { passive: false });

            const imageClose = document.getElementById('image-viewer-close');
            if (imageClose) imageClose.addEventListener('click', function (e) { e.stopImmediatePropagation(); playClick(clickSound); closeAllViewers(); });
            const videoClose = document.getElementById('video-viewer-close');
            if (videoClose) videoClose.addEventListener('click', function (e) { e.stopImmediatePropagation(); playClick(clickSound); closeAllViewers(); });
            const closeScreen = document.getElementById('close-screen');
            if (closeScreen) closeScreen.addEventListener('click', closeAllViewers);
            const closeVideo = document.getElementById('close-video');
            if (closeVideo) closeVideo.addEventListener('click', closeAllViewers);

            const smart = document.getElementById('smart-screen');
            if (smart) smart.addEventListener('click', function () {
                openSmartScreen({ title: 'Active Assailant', preview: PATHS.contentPreview, contentUrl: PATHS.content });
            });
            const bridge = document.getElementById('bridge-frame');
            if (bridge) bridge.addEventListener('click', function () {
                const isInVR = sceneEl && sceneEl.is && sceneEl.is('vr-mode');
                if (isInVR) enterBridgeTour();
                else openSmartScreen({ title: '360 Interactive Scenario', preview: PATHS.bridgePreview, contentUrl: PATHS.bridge });
            });

            const ball = document.getElementById('video-ball');
            if (ball) ball.addEventListener('click', enter360);
            const exitBtn = document.getElementById('exit-button');
            if (exitBtn) exitBtn.addEventListener('click', exit360);
            const exitBridge = document.getElementById('exit-bridge');
            if (exitBridge) exitBridge.addEventListener('click', exitBridgeTour);
            const closeVrBrowser = document.getElementById('close-vr-browser');
            if (closeVrBrowser) closeVrBrowser.addEventListener('click', function () {
                exitBridgeTour();
                closeAllViewers();
            });

            document.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape') return;
                if (isEntityVisible(videoMode)) { exit360(); return; }
                if (isEntityVisible(bridgeMode)) { exitBridgeTour(); return; }
                closeAllViewers();
            });
        });
    })();
    </script>
</body>
</html>
